<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro & Markets Intelligence — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #05070C;
    --panel: #0A0F17;
    --card: #121A26;
    --card-2: #0E1520;
    --line: rgba(255,255,255,0.08);
    --text: #E9EDF2;
    --dim: #8996A6;
    --dim-2: #5A6675;
    --green: #3FE0A5;
    --green-bg: rgba(63,224,165,0.10);
    --amber: #F2B341;
    --amber-bg: rgba(242,179,65,0.12);
    --blue: #5FA8E8;
    --blue-bg: rgba(95,168,232,0.10);
    --red: #E86A6A;
    --red-bg: rgba(232,106,106,0.12);
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(63,224,165,0.05), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(95,168,232,0.06), transparent 45%);
    font-family: var(--font-body);
    color: var(--text);
    min-height: 100vh;
  }
  ::-webkit-scrollbar{ width:7px; height:7px; }
  ::-webkit-scrollbar-thumb{ background: rgba(63,224,165,0.28); border-radius:4px; }

  .app{ max-width: 1320px; margin: 0 auto; padding: 14px; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel); border:1px solid var(--line); border-radius:12px;
    padding: 10px 16px; margin-bottom: 10px; gap: 12px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:7px;
    background: linear-gradient(135deg, var(--green), var(--blue));
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:700; font-size:14px; color:#05070C;
  }
  .brand-name{ font-family: var(--font-mono); font-weight:600; font-size:14.5px; }
  .brand-sub{ font-size:10.5px; color:var(--dim); margin-top:1px; }

  .ticker-strip{
    font-family: var(--font-mono); font-size:11px; color: var(--dim);
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  .ticker-strip b{ color: var(--text); font-weight:500; }
  .ticker-strip .up{ color: var(--green); }
  .ticker-strip .down{ color: var(--red); }

  .legend{ display:flex; gap:10px; font-family: var(--font-mono); font-size:9.5px; color:var(--dim); }
  .legend .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
  .legend .critical .dot{ background: var(--red); }
  .legend .important .dot{ background: var(--amber); }
  .legend .watch .dot{ background: var(--green); }

  /* ---------- LAYOUT ---------- */
  .body-row{ display:grid; grid-template-columns: 235px 1fr; gap: 12px; align-items:start; }

  .nav{
    background: var(--panel); border:1px solid var(--line); border-radius:12px;
    padding: 14px 10px; max-height: 82vh; overflow-y:auto; position: sticky; top: 18px;
  }
  .nav-group-label{
    font-family: var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.1em;
    color: var(--dim-2); padding: 10px 10px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:500; padding: 8px 10px; border-radius:7px;
    color: var(--dim); cursor:pointer; margin-bottom:2px;
  }
  .nav-item:hover{ background: rgba(255,255,255,0.05); color: var(--text); }
  .nav-item.active{ background: var(--green-bg); color: var(--green); font-weight:600; }
  .nav-item .ic{ font-size: 14px; width: 18px; text-align:center; }

  .content{
    background: var(--panel); border:1px solid var(--line); border-radius:12px;
    padding: 18px 22px; min-height: 78vh;
  }
  .section-head{ margin-bottom: 14px; border-bottom:1px solid var(--line); padding-bottom: 11px; }
  .section-head h2{ margin:0 0 4px; font-family: var(--font-mono); font-size:18px; }
  .section-head p{ margin:0; font-size:12.5px; color: var(--dim); }

  .grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* ---------- SHARED CARD PARTS ---------- */
  .badge{
    font-family: var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em;
    padding: 3px 7px; border-radius: 4px; display:inline-flex; align-items:center; gap:4px; font-weight:700;
  }
  .badge::before{ content:'●'; font-size:6px; }
  .badge.critical{ color: var(--red); background: var(--red-bg); }
  .badge.important{ color: var(--amber); background: var(--amber-bg); }
  .badge.watch{ color: var(--green); background: var(--green-bg); }

  .story-card{
    background: var(--card); border:1px solid var(--line); border-radius:10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .story-card h4{ font-size: 14px; margin: 8px 0 10px; color: var(--text); }
  .chain{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin: 8px 0 12px; font-family: var(--font-mono); font-size:10px; }
  .chain .step{ background: rgba(255,255,255,0.04); border:1px solid var(--line); color: var(--dim); padding:4px 8px; border-radius:5px; white-space:nowrap; }
  .chain .arrow{ color: var(--green); font-weight:700; }
  .block{ margin-bottom: 10px; }
  .block:last-child{ margin-bottom:0; }
  .block .label{ font-family: var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color: var(--amber); margin-bottom:3px; }
  .block .label.impact{ color: var(--blue); }
  .block p{ margin:0; font-size:13px; line-height:1.5; }
  .block ul{ margin:4px 0 0; padding-left:18px; font-size:13px; }
  .block li{ margin-bottom:2px; }

  .pill-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top: 10px; }
  .pill{
    font-family: var(--font-mono); font-size:9.5px; color: var(--blue); background: var(--blue-bg);
    border:1px solid rgba(95,168,232,0.3); padding: 3px 9px; border-radius: 12px; cursor:pointer;
  }
  .pill:hover{ background: rgba(95,168,232,0.22); }
  .pill::before{ content:'→ '; }

  .note{ margin-top:10px; font-family: var(--font-mono); font-size:9.5px; color: var(--dim-2); border-top:1px dashed var(--line); padding-top:7px; }

  table.tbl{ width:100%; border-collapse: collapse; font-size:12.5px; margin: 10px 0; }
  table.tbl th{ font-family: var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color: var(--dim); text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  table.tbl td{ padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  table.tbl tr:last-child td{ border-bottom:none; }
  .tag-mini{ font-family: var(--font-mono); font-size:9px; padding:1px 5px; border-radius:3px; }
  .tag-mini.actual{ background: var(--green-bg); color: var(--green); }
  .tag-mini.guidance{ background: var(--blue-bg); color: var(--blue); }
  .tag-mini.estimate{ background: var(--amber-bg); color: var(--amber); }
  .tag-mini.analysis{ background: rgba(255,255,255,0.08); color: var(--dim); }

  .mini-item{ display:flex; gap:9px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .mini-item:last-child{ border-bottom:none; }
  .mini-item .mi-body{ flex:1; }
  .mini-item .mi-title{ font-size:13px; font-weight:600; margin-bottom:2px; }
  .mini-item .mi-why{ font-size:11.5px; color: var(--dim); }

  .sector-chip{
    font-family: var(--font-mono); font-size:11px; padding:6px 11px; border-radius:16px;
    background: var(--card-2); border:1px solid var(--line); display:inline-flex; align-items:center; gap:5px; margin: 3px 4px 3px 0;
  }
  .sector-chip.up{ color: var(--green); border-color: rgba(63,224,165,0.3); }
  .sector-chip.down{ color: var(--red); border-color: rgba(232,106,106,0.3); }
  .sector-chip.flat{ color: var(--dim); }

  .rank-row{ display:flex; align-items:center; gap:12px; padding: 10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-num{ font-family: var(--font-mono); font-weight:700; color: var(--dim-2); width:22px; }
  .rank-body{ flex:1; }
  .rank-title{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .rank-why{ font-size:11.5px; color: var(--dim); margin-top:2px; }

  .scenario-row{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin: 8px 0; }
  .scenario{ background: rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .scenario .st{ font-family: var(--font-mono); font-size:9.5px; text-transform:uppercase; margin-bottom:5px; }
  .scenario.bull .st{ color: var(--green); }
  .scenario.base .st{ color: var(--dim); }
  .scenario.bear .st{ color: var(--red); }
  .scenario p{ font-size:12px; margin:0; }

  .company-card{ background: var(--card-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .company-card .ch{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .company-card .ch b{ font-size:13.5px; }
  .company-card .ch span{ font-family: var(--font-mono); font-size:10px; color: var(--dim); }
  .metric-row{ display:flex; flex-wrap:wrap; gap: 14px; font-size: 11.5px; }
  .metric-row .m{ min-width: 90px; }
  .metric-row .m .k{ color: var(--dim); font-size:9.5px; text-transform:uppercase; font-family: var(--font-mono); }
  .metric-row .m .v{ font-weight:600; }

  .concept-group{ margin-bottom: 16px; }
  .concept-group h4{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; color: var(--blue); margin: 0 0 8px; }
  .concept-item{ padding: 7px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:12.5px; }
  .concept-item:last-child{ border-bottom:none; }
  .concept-item b{ font-family: var(--font-mono); }

  .qcard{ background: var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .qcard .q{ font-weight:700; margin-bottom:8px; font-size:13.5px; }
  .qcard .fq{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color: var(--dim); }


  /* ---------- DAILY DATA REFRESH ---------- */
  .refresh-panel{
    background: var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; display:flex; align-items:center;
    justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .refresh-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .refresh-status{font-family:var(--font-mono);font-size:10px;color:var(--dim)}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:5px}
  .status-dot.live{background:var(--green)}
  .status-dot.error{background:var(--red)}
  .refresh-btn,.settings-btn{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:7px; padding:7px 11px; cursor:pointer; font-family:var(--font-mono);
    font-size:10px; font-weight:600;
  }
  .refresh-btn:hover,.settings-btn:hover{border-color:rgba(63,224,165,.45);background:var(--green-bg)}
  .refresh-btn:disabled{opacity:.5;cursor:wait}
  .refresh-meta{font-family:var(--font-mono);font-size:9px;color:var(--dim-2)}
  .update-banner{
    display:none; background:var(--blue-bg); border:1px solid rgba(95,168,232,.28);
    border-radius:8px; padding:9px 11px; margin-bottom:14px; font-size:11.5px; color:var(--dim);
  }
  .update-banner.show{display:block}
  .settings-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .settings-card label{display:block;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;color:var(--dim);margin:10px 0 5px}
  .settings-card input,.settings-card select{
    width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:6px;
    padding:8px 9px;color:var(--text);font-family:var(--font-mono);font-size:11px;
  }
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-top:12px}
  .toggle-row input{width:auto}
  .source-status{font-family:var(--font-mono);font-size:9.5px;color:var(--dim);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .source-status:last-child{border-bottom:none}
  .live-empty{padding:10px 0;color:var(--dim);font-size:12px}
  .content > .note{ margin-top: 4px; }
  .live-source{ margin-top:8px; }
  .content > .story-card + .story-card{ margin-top: 8px; }
  .change-card{border-left:3px solid var(--green);padding-left:10px;margin:9px 0}
  .change-card.changed{border-left-color:var(--amber)}
  .change-card.revised{border-left-color:var(--blue)}
  .change-card.outdated{border-left-color:var(--red)}
  .refresh-history{max-height:250px;overflow:auto}
  .refresh-history-row{display:grid;grid-template-columns:120px 90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-family:var(--font-mono);font-size:9.5px}
  .context-divider{margin:18px 0 10px;padding:8px 10px;border:1px dashed rgba(95,168,232,.28);border-radius:8px;background:rgba(95,168,232,.06);display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:10px;color:var(--blue)}
  .context-divider small{color:var(--dim-2);font-size:9px}
  @media (max-width: 900px){
    .settings-grid{grid-template-columns:1fr}
    .refresh-history-row{grid-template-columns:1fr}
  }

  @media (max-width: 900px){
    .body-row{ grid-template-columns: 1fr; }
    .nav{ position:static; max-height:none; }
    .grid-2, .grid-3, .scenario-row{ grid-template-columns: 1fr; }
  }

  .live-update-layer{background:linear-gradient(180deg,rgba(63,224,165,.07),rgba(95,168,232,.04));border:1px solid rgba(63,224,165,.24);border-radius:10px;padding:12px 14px;margin:0 0 14px;}
  .live-update-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--font-mono);font-size:9px;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .live-update-head span:last-child{color:var(--dim);text-transform:none;letter-spacing:0;}
  .live-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .live-label{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
  .live-story{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;}
  .live-story b{display:block;margin-bottom:2px;}
  .live-story div div{color:var(--dim);font-size:10.5px;line-height:1.4;}
  @media (max-width:900px){.live-grid{grid-template-columns:1fr;}}

</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-name">Macro & Markets Intelligence</div>
        <div class="brand-sub">Dashboard · 20 dedicated sections</div>
      </div>
    </div>
    <div class="ticker-strip">
      NIFTY <b id="tickNifty">—</b> · SENSEX <b id="tickSensex">—</b> · USD/INR <b id="tickUsdInr">—</b> · US10Y <b id="tickUs10y">—</b> · BRENT <b id="tickBrent">—</b> · GOLD <b id="tickGold">—</b>
    </div>
    <div class="legend">
      <span class="critical"><span class="dot"></span>Critical</span>
      <span class="important"><span class="dot"></span>Important</span>
      <span class="watch"><span class="dot"></span>Watch</span>
    </div>
  </div>


  <div class="refresh-panel">
    <div class="refresh-left">
      <button class="refresh-btn" id="refreshBtn" onclick="refreshData(true)">↻ Refresh Now</button>
      <span class="refresh-status"><span class="status-dot" id="statusDot"></span><span id="refreshStatus">Data source not configured</span></span>
      <span class="refresh-meta" id="lastUpdated">Last update: —</span>
    </div>
    <div class="refresh-left">
      <span class="refresh-meta">Scheduled checks: 07:00 &amp; 19:00 IST</span>
      <button class="settings-btn" onclick="selectSection('data-refresh')">⚙ Data Refresh</button>
    </div>
  </div>
  <div class="update-banner" id="updateBanner"></div>

  <div class="body-row">
    <nav class="nav" id="nav"></nav>
    <main class="content" id="content"></main>
  </div>

</div>

<script>
/* =========================================================
   NOTE ON DATA
   The visible figures/headlines below are fallback content. When live data is available, live-aware renderers replace these blocks without leaving empty sections. The refresh layer can replace/update
   live data when the configured endpoint returns the JSON contract documented in the Data Refresh section. A production build swaps
   each section's data array for a live pull (RBI/SEBI/exchange
   feeds, news wires, filings) refreshed on a schedule, per the
   "never fabricate statistics" rule this assistant runs on.
   ========================================================= */
const DEMO_NOTE = 'Reference context — current live values appear in the LIVE UPDATES panel above; preserved context is not presented as a live quote.';

/* ---------------- shared render helpers ---------------- */
function badge(p){ return '<span class="badge '+p+'">'+p.toUpperCase()+'</span>'; }
function chain(steps){
  return '<div class="chain">' + steps.map((s,i)=>(i>0?'<span class="arrow">→</span>':'')+'<span class="step">'+s+'</span>').join('') + '</div>';
}
function block(label, html, cls){ return '<div class="block"><div class="label'+(cls?' '+cls:'')+'">'+label+'</div>'+html+'</div>'; }
function pills(ids){
  return '<div class="pill-row">' + ids.map(id => '<span class="pill" onclick="selectSection(\''+id+'\')">'+SECTIONS[id].title+'</span>').join('') + '</div>';
}
function note(t){ return '<div class="note">'+t+'</div>'; }
function scenarioRow(bull, base, bear){
  return '<div class="scenario-row">'+
    '<div class="scenario bull"><div class="st">Bull</div><p>'+bull+'</p></div>'+
    '<div class="scenario base"><div class="st">Base</div><p>'+base+'</p></div>'+
    '<div class="scenario bear"><div class="st">Bear</div><p>'+bear+'</p></div>'+
  '</div>';
}
function storyCard({priority, title, chainSteps, blocks, related, showNote=true}){
  return '<div class="story-card">' +
    badge(priority) +
    '<h4>'+title+'</h4>' +
    (chainSteps ? chain(chainSteps) : '') +
    blocks.map(b => block(b[0], b[1], b[2])).join('') +
    (related && related.length ? pills(related) : '') +
    (showNote ? note(DEMO_NOTE) : '') +
  '</div>';
}
function miniItem(priority, title, why, sectionId){
  return '<div class="mini-item">' +
    '<div>'+badge(priority)+'</div>' +
    '<div class="mi-body"><div class="mi-title">'+title+'</div><div class="mi-why">Why it matters: '+why+' · <span class="pill" style="margin-top:4px;display:inline-block" onclick="selectSection(\''+sectionId+'\')">'+SECTIONS[sectionId].title+'</span></div></div>' +
  '</div>';
}
function tbl(headers, rows){
  return '<table class="tbl"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') +
  '</tbody></table>';
}
function tagMini(kind, text){ return '<span class="tag-mini '+kind+'">'+text+'</span>'; }

/* =========================================================
   SECTION DEFINITIONS
   ========================================================= */
const SECTIONS = {

  dashboard: { icon:'🏠', title:'Overview', group:null, purpose:'Daily snapshot across every section — dive into any story via its section link.',
    render(){
      const liveDash = liveSection('dashboard');
      const marketRows = Array.isArray(liveDash?.markets) && liveDash.markets.length ? liveDash.markets.slice(0,5).map(x=>[x.name,x.level,x.change]) : [
        ['Nifty 50','23,635.10','▼0.61%'],
        ['Sensex','75,577.58','▼0.73%'],
        ['USD/INR','94.84','▼0.30%'],
        ['US 10Y Yield','4.80%','—'],
        ['Brent Crude','$98.35','▲1.39%']
      ];
      return (
        '<div class="grid-2">' +
          '<div>' +
            '<h3 style="font-family:var(--font-mono);font-size:13px;color:var(--dim);margin:0 0 6px;">TOP 5 GLOBAL STORIES</h3>' +
            miniItem('critical','Fed signals one more 2026 rate cut','eases global financing conditions','central-banks') +
            miniItem('important','China Q3 GDP growth slows to 4.6%','weaker China demand pressures commodity exporters','global-economy') +
            miniItem('important','Eurozone inflation ticks up to 2.4%','could delay ECB rate cuts','central-banks') +
            miniItem('watch','Brent crude slips below $70','eases India\'s import bill','commodities-energy') +
            miniItem('watch','US jobless claims edge higher','adds to the soft-landing narrative','global-economy') +
          '</div>' +
          '<div>' +

/* ---------------- live refresh / scheduling ---------------- */
const REFRESH_STORAGE = {
  config: 'macroMarketsRefreshConfig_v1',
  snapshot: 'macroMarketsSnapshot_v1',
  history: 'macroMarketsRefreshHistory_v1'
};

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function timeOptions(selected){
  const options = ['06:00','07:00','08:00','09:00','18:00','19:00','20:00','21:00'];
  return options.map(v => '<option value="'+v+'" '+(v===selected?'selected':'')+'>'+v+' IST</option>').join('');
}
function getRefreshConfig(){
  const defaults = {
    apiEndpoint: window.location.origin + '/api/macro-data',
    morningTime: '07:00',
    eveningTime: '19:00',
    autoRefresh: false,
    dailySchedule: true
  };
  try { return {...defaults, ...(JSON.parse(localStorage.getItem(REFRESH_STORAGE.config) || '{}'))}; }
  catch(e){ return defaults; }
}
function saveRefreshSettings(){
  const cfg = {
    apiEndpoint: (document.getElementById('apiEndpoint')?.value || '').trim(),
    morningTime: document.getElementById('morningTime')?.value || '07:00',
    eveningTime: document.getElementById('eveningTime')?.value || '19:00',
    autoRefresh: !!document.getElementById('autoRefresh')?.checked,
    dailySchedule: !!document.getElementById('dailySchedule')?.checked
  };
  localStorage.setItem(REFRESH_STORAGE.config, JSON.stringify(cfg));
  startRefreshScheduler();
  setRefreshStatus(cfg.apiEndpoint ? 'Settings saved' : 'Settings saved — API endpoint missing', !!cfg.apiEndpoint);
  showBanner('Refresh settings saved. A live update requires a configured API endpoint.', !cfg.apiEndpoint);
}
function getRefreshHistory(){
  try { return JSON.parse(localStorage.getItem(REFRESH_STORAGE.history) || '[]'); }
  catch(e){ return []; }
}
function writeRefreshHistory(entry){
  const next = [entry, ...getRefreshHistory()].slice(0, 50);
  localStorage.setItem(REFRESH_STORAGE.history, JSON.stringify(next));
}
function clearRefreshHistory(){
  localStorage.removeItem(REFRESH_STORAGE.history);
  if (document.getElementById('refreshHistory')) document.getElementById('refreshHistory').innerHTML = '<div class="refresh-meta">No refresh history.</div>';
}
function renderRefreshHistory(history){
  if (!history.length) return '<div class="refresh-meta">No refresh history yet.</div>';
  return history.map(h =>
    '<div class="refresh-history-row"><span>'+escapeHtml(h.time)+'</span><span>'+escapeHtml(h.status)+'</span><span>'+escapeHtml(h.message)+'</span></div>'
  ).join('');
}
function setRefreshStatus(message, live=false, error=false){
  const el = document.getElementById('refreshStatus');
  const dot = document.getElementById('statusDot');
  if (el) el.textContent = message;
  if (dot){
    dot.classList.toggle('live', live);
    dot.classList.toggle('error', error);
  }
}
function showBanner(message, error=false){
  const b = document.getElementById('updateBanner');
  if (!b) return;
  b.textContent = message;
  b.style.borderColor = error ? 'rgba(232,106,106,.35)' : 'rgba(95,168,232,.28)';
  b.classList.add('show');
  clearTimeout(window.__bannerTimer);
  window.__bannerTimer = setTimeout(()=>b.classList.remove('show'), 7000);
}
function setLastUpdated(iso){
  const el = document.getElementById('lastUpdated');
  if (!el) return;
  el.textContent = iso ? 'Last update: ' + formatDateTime(iso) : 'Last update: —';
}
function formatDateTime(iso){
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return new Intl.DateTimeFormat('en-IN',{
    timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'short'
  }).format(d);
}
function hashObject(obj){
  try {
    const str = JSON.stringify(obj);
    let h = 2166136261;
    for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
    return (h>>>0).toString(16);
  } catch(e){ return ''; }
}
function updateHeaderTicker(payload){
  const pick = (sectionId, name) => {
    const a = payload?.sections?.[sectionId]?.assets || [];
    return a.find(x => String(x.name||'').toLowerCase() === name.toLowerCase());
  };
  const find = (sectionIds, name) => {
    for (const id of sectionIds) { const x = pick(id,name); if (x) return x; }
    return null;
  };
  const set = (id, asset) => {
    const el=document.getElementById(id); if(!el) return;
    if(!asset){ el.textContent='—'; el.className=''; return; }
    el.textContent = `${asset.level || '—'}${asset.change ? ' '+asset.change : ''}`;
    el.className = String(asset.change||'').includes('▼') ? 'down' : String(asset.change||'').includes('▲') ? 'up' : '';
  };
  set('tickNifty', find(['indian-markets'],'Nifty 50'));
  set('tickSensex', find(['indian-markets'],'Sensex'));
  set('tickUsdInr', find(['indian-markets','forex-capital-flows'],'USD/INR'));
  set('tickUs10y', find(['global-markets'],'US 10Y Treasury'));
  set('tickBrent', find(['commodities-energy','global-markets'],'Brent Crude'));
  set('tickGold', find(['commodities-energy','global-markets'],'Gold'));
}

function applyLivePayload(payload){
  // Keep the existing information architecture intact.
  // Store the latest payload so section-specific renderers can be upgraded
  // to consume live arrays without losing the last known response.
  window.LIVE_DATA = payload;
  localStorage.setItem(REFRESH_STORAGE.snapshot, JSON.stringify(payload));
  updateHeaderTicker(payload);

  const changes = Array.isArray(payload.changes) ? payload.changes : [];
  const count = changes.length;
  const msg = count
    ? 'Updated '+count+' meaningful change(s): '+changes.slice(0,3).map(c => c.title || c.summary || c.type).join(' · ')
    : 'Refresh completed — no material changes reported by the data source.';
  showBanner(msg);
  setLastUpdated(payload.updatedAt || new Date().toISOString());

  if (changes.length) {
    changes.slice(0, 15).forEach(c => writeRefreshHistory({
      time: c.timestamp ? formatDateTime(c.timestamp) : formatDateTime(new Date().toISOString()),
      status: c.type || 'CHANGED',
      message: (c.section ? c.section+' — ' : '') + (c.title || c.summary || 'Material change')
    }));
  } else {
    writeRefreshHistory({
      time: formatDateTime(payload.updatedAt || new Date().toISOString()),
      status: 'UPDATED',
      message: 'Refresh completed — no material changes reported.'
    });
  }

  // Re-render the currently selected section so live-aware renderers can pick up LIVE_DATA.
  selectSection(CURRENT_SECTION_ID || 'dashboard');
}
async function refreshData(manual=false){
  const cfg = getRefreshConfig();
  const endpoint = cfg.apiEndpoint || (window.location.origin + '/api/macro-data');
  const btn = document.getElementById('refreshBtn');

  if (btn) btn.disabled = true;
  setRefreshStatus('Refreshing…', false, false);

  try{
    // The refresh endpoint returns the complete merged snapshot. Use that response directly
    // instead of triggering a refresh and then making a second request that can return a
    // stale/sparse payload from another serverless instance.
    const refreshUrl = endpoint + (endpoint.includes('?') ? '&force=1' : '?force=1');
    const trigger = await fetch(refreshUrl, {method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
    if (!trigger.ok) throw new Error('Live data HTTP '+trigger.status);
    const payload = await trigger.json();
    if (!payload || !payload.sections) throw new Error('Refresh returned an invalid data payload');

    const previous = JSON.parse(localStorage.getItem(REFRESH_STORAGE.snapshot) || 'null');
    const prevHash = previous ? hashObject(previous) : '';
    const newHash = hashObject(payload);

    applyLivePayload(payload);
    const warningCount = Array.isArray(payload.dataQuality?.warnings) ? payload.dataQuality.warnings.length : 0;
    const baseStatus = newHash && newHash !== prevHash ? 'Live data refreshed' : 'Connected — no material change';
    setRefreshStatus(baseStatus + (warningCount ? ' · '+warningCount+' source warning(s)' : ''), true, false);

    writeRefreshHistory({
      time: formatDateTime(payload.updatedAt || new Date().toISOString()),
      status: 'UPDATED',
      message: 'Live snapshot refreshed; full analyst context preserved.' + (warningCount ? ' '+warningCount+' source warning(s) recorded separately.' : '')
    });

    if (document.querySelector('.section-head h2')?.textContent.includes('Data Refresh')) {
      selectSection('data-refresh');
    }
    return true;
  }catch(err){
    setRefreshStatus('Refresh failed: '+err.message, false, true);
    showBanner('Live refresh failed: '+err.message+'. The previous dashboard snapshot has been preserved.', true);
    writeRefreshHistory({
      time: formatDateTime(new Date().toISOString()),
      status: 'ERROR',
      message: err.message
    });
    return false;
  }finally{
    if (btn) btn.disabled = false;
  }
}

let __refreshTimer = null;
function startRefreshScheduler(){
  clearInterval(__refreshTimer);
  const cfg = getRefreshConfig();
  window.__refreshHourKey = window.__refreshHourKey || null;

  // One scheduler loop keeps both hourly and twice-daily checks active.
  const tick = () => {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-GB',{
      timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', hour12:false
    }).formatToParts(now);
    const hm = parts.find(p=>p.type==='hour')?.value+':'+parts.find(p=>p.type==='minute')?.value;
    const dateKey = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(now);

    if (cfg.dailySchedule) {
      const dailyKey = dateKey+'|'+hm;
      if ((hm===cfg.morningTime || hm===cfg.eveningTime) && dailyKey !== window.__lastDailyRun) {
        window.__lastDailyRun = dailyKey;
        refreshData(false);
        return;
      }
    }

    if (cfg.autoRefresh && now.getMinutes() === 0) {
      const hourlyKey = dateKey+'|'+now.getHours();
      if (hourlyKey !== window.__refreshHourKey) {
        window.__refreshHourKey = hourlyKey;
        refreshData(false);
      }
    }
  };

  __refreshTimer = setInterval(tick, 30 * 1000);
  tick();
}

window.addEventListener('load', () => {
  const cfg = getRefreshConfig();
  const history = getRefreshHistory();
  const snapshot = JSON.parse(localStorage.getItem(REFRESH_STORAGE.snapshot) || 'null');
  if (snapshot?.updatedAt) { setLastUpdated(snapshot.updatedAt); updateHeaderTicker(snapshot); }
  if (cfg.apiEndpoint) setRefreshStatus('Live connection ready', true, false);
  else setRefreshStatus('Data source not configured', false, false);
  startRefreshScheduler();
});

/* ---------------- live data rendering ---------------- */
function esc(v){ return escapeHtml(v == null ? '—' : v); }
function liveSection(id){ return window.LIVE_DATA?.sections?.[id] || null; }
function sourceMeta(data){
  if (!data) return '';
  const source = data.source || data.sources || 'Live source';
  const updated = data.updatedAt || window.LIVE_DATA?.updatedAt;
  return '<div class="note live-source">Source: '+esc(Array.isArray(source)?source.join(', '):source)+' · Updated: '+(updated?esc(formatDateTime(updated)):'—')+' · Live data</div>';

/* Data status badge — shows freshness classification on each market card */
function dataStatusBadge(status){
  if(!status) return '';
  const s = String(status).toUpperCase();
  const map = {
    'LIVE_INTRADAY': ['LIVE', 'var(--green)', 'var(--green-bg)'],
    'TODAY_CLOSE': ['CLOSE', 'var(--blue)', 'var(--blue-bg)'],
    'PREVIOUS_SESSION': ['PREV', 'var(--amber)', 'var(--amber-bg)'],
    'STALE': ['STALE', 'var(--red)', 'var(--red-bg)'],
    'UNAVAILABLE': ['N/A', 'var(--dim)', 'rgba(255,255,255,0.06)'],
    'HISTORICAL': ['HIST', 'var(--dim)', 'rgba(255,255,255,0.06)'],
    'DEMO': ['REF', 'var(--dim-2)', 'rgba(255,255,255,0.04)'],
  };
  const info = map[s] || [s.replace(/_/g,' '), 'var(--dim)', 'rgba(255,255,255,0.06)'];
  return '<span style="font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:0.04em;padding:2px 5px;border-radius:3px;color:'+info[1]+';background:'+info[2]+';margin-left:4px;">'+esc(info[0])+'</span>';
}
/* Market table with data status badges — used by live market renderers */
function marketTableWithStatus(headers, assets){
  if(!Array.isArray(assets) || !assets.length) return '<p style="color:var(--dim);font-size:12px;">No data available.</p>';
  const rows = assets.map(x => {
    const status = dataStatusBadge(x.dataStatus);
    const session = x.sessionStatus ? '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--dim-2);margin-left:3px;">'+esc(x.sessionStatus)+'</span>' : '';
    const src = x.source ? '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--dim-2);"> · '+esc(x.source)+'</span>' : '';
    const age = x.ageMinutes != null ? '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--dim-2);"> · '+Math.round(x.ageMinutes)+'m ago</span>' : '';
    return [
      esc(x.name || x.instrument || x.pair || x.commodity || '—'),
      esc(x.level || x.yield || x.price || '—'),
      (x.change ? esc(x.change) : '—') + status + session,
    ];
  });
  return tbl(headers, rows);
}
function changeHtml(c){
  if (!c) return '';
  const typ = String(c.type||'CHANGED').toUpperCase();
  const cls = typ==='OUTDATED'?'outdated':typ==='REVISED'?'revised':typ==='NEW'?'':'changed';
  return '<div class="change-card '+cls+'"><b>'+esc(typ)+'</b><div style="font-size:11px;color:var(--dim);margin-top:2px;">'+esc(c.title||c.summary||'Material change')+'</div></div>';
}
function liveTable(headers, rows){
  return tbl(headers, (rows||[]).map(r => Array.isArray(r) ? r.map(v=>esc(v)) : []));
}
function storyFromLive(story, related=[]){
  if (!story) return '';
  const p = String(story.priority||'watch').toLowerCase();
  const blocks=[];
  const fields=[
    ['What happened','whatHappened'],['Why','why'],['Key data','keyData'],['Economic impact','economicImpact'],
    ['Market impact','marketImpact'],['Sector impact','sectorImpact'],['Company impact','companyImpact'],
    ['India impact','indiaImpact'],['Outlook','outlook'],['What happens next','next']
  ];
  fields.forEach(([label,key])=>{ if(story[key]) blocks.push([label,'<p>'+esc(story[key])+'</p>', /impact/i.test(label)?'impact':undefined]); });
  return storyCard({priority:p,title:story.title||'Live story',chainSteps:story.chainSteps||['What happened','Why','Impact','Outlook'],blocks,related,showNote:false});
}
function liveGenericStories(id, fallbackRelated=[]){
  const data=liveSection(id);
  if(!data) return null;
  let out='';
  if(data.summary) out += '<div class="story-card"><h4 style="margin-top:0;">Live summary</h4><p style="font-size:13px;line-height:1.5;">'+esc(data.summary)+'</p>'+sourceMeta(data)+'</div>';
  if(Array.isArray(data.stories)) data.stories.slice(0,12).forEach(st=>{out += storyFromLive(st, st.related||fallbackRelated);});
  if(Array.isArray(data.changes) && data.changes.length){
    out += '<div class="story-card"><h4 style="margin-top:0;">What changed since last refresh</h4>'+data.changes.slice(0,15).map(changeHtml).join('')+'</div>';
  }
  return out || '<div class="story-card"><p style="color:var(--dim)">Live source connected, but no records were returned for this section.</p></div>';
}

function liveUpdateLayer(id){
  const d = liveSection(id);
  if (!d) return '';
  const source = Array.isArray(d.source) ? d.source.join(', ') : (d.source || window.LIVE_DATA?.sources || 'Live public sources');
  const checked = d.updatedAt || window.LIVE_DATA?.updatedAt;
  let html = '<div class=\"live-update-layer\"><div class=\"live-update-head\"><span>● LIVE UPDATES</span><span>' + (checked ? esc(formatDateTime(checked)) : 'Latest refresh') + ' · ' + esc(source) + '</span></div>';

  if (id === 'global-markets') {
    html += '<div class="live-label">LATEST GLOBAL MARKET FEED</div>';
  } else if (id === 'dashboard' && d.liveUpdates) {
    const markets = Array.isArray(d.liveUpdates.markets) ? d.liveUpdates.markets : [];
    const stories = Array.isArray(d.liveUpdates.stories) ? d.liveUpdates.stories : [];
    if (markets.length || stories.length) html += '<div class=\"live-grid\">';
    if (markets.length) html += '<div><div class=\"live-label\">LATEST VERIFIED MARKET DATA</div>' + liveTable(['Asset','Level','Change'], markets.slice(0,5).map(x=>[x.name,x.level,x.change])) + '</div>';
    if (stories.length) html += '<div><div class=\"live-label\">LATEST VERIFIED DEVELOPMENTS</div>' + stories.slice(0,4).map(x=>'<div class=\"live-story\">'+badge(x.priority||'watch')+'<div><b>'+esc(x.title||'Live update')+'</b><div>'+esc(x.why||'')+'</div></div></div>').join('') + '</div>';
    if (markets.length || stories.length) html += '</div>';
  } else {
    if (Array.isArray(d.indicators) && d.indicators.length) html += '<div class=\"live-label\">LATEST VERIFIED INDICATORS</div>' + liveTable(['Indicator','Current','Previous','Change'], d.indicators.slice(0,10).map(x=>[x.name,x.current,x.previous,x.change]));
    else if (Array.isArray(d.assets) && d.assets.length) html += '<div class=\"live-label\">LATEST VERIFIED ASSET DATA</div>' + liveTable(['Asset','Level','Change'], d.assets.slice(0,10).map(x=>[x.name,x.level||x.price,x.change]));
    else if (Array.isArray(d.banks) && d.banks.length) html += '<div class=\"live-label\">LATEST VERIFIED CENTRAL-BANK DATA</div>' + liveTable(['Bank','Current Rate','Decision','Stance'], d.banks.slice(0,8).map(x=>[x.bank,x.currentRate,x.latestDecision,x.stance]));
    else if (Array.isArray(d.stories) && d.stories.length) html += '<div class=\"live-label\">LATEST VERIFIED DEVELOPMENTS</div>' + d.stories.slice(0,4).map(x=>'<div class=\"live-story\">'+badge(x.priority||'watch')+'<div><b>'+esc(x.title||'Live update')+'</b><div>'+esc(x.why||x.whatHappened||'')+'</div></div></div>').join('');
  }
  return html + '</div>';
}

function renderSectionWithLive(id, fallback){
  // Live data is additive. Never replace the detailed analyst framework with a sparse payload.
  try { return liveUpdateLayer(id) + fallback(); }

}

  document.getElementById('content').innerHTML =
    '<div class="section-head"><h2>'+s.icon+' '+s.title+'</h2><p>'+s.purpose+'</p></div>' +
    renderSectionWithLive(id, s.render);
  renderNav(id);
  document.querySelector('.content').scrollIntoView({behavior:'instant', block:'start'});
  window.scrollTo(0,0);
}

selectSection('dashboard');
</script>
</body>
</html>
